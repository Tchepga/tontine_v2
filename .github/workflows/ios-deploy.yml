name: 🍎 iOS → TestFlight

# Démarre sur un push vers master, après une publication Play réussie
# (codemagic.yaml → android-deploy → « Lancer TestFlight sur GitHub »),
# ou à la main : Actions → ce workflow → Run workflow.
#
# Secrets à créer sur l'autre ordinateur.
# GitHub → Settings → Secrets and variables → Actions :
#   APP_STORE_CONNECT_KEY_ID       ID de la clé API App Store Connect
#   APP_STORE_CONNECT_ISSUER_ID    Issuer ID
#   APP_STORE_CONNECT_PRIVATE_KEY  contenu du fichier AuthKey_XXXX.p8
#   IOS_DISTRIBUTION_CERT_P12      certificat iOS Distribution (.p12) en base64
#   IOS_DISTRIBUTION_CERT_PASSWORD mot de passe du .p12
#   IOS_PROVISIONING_PROFILE       profil App Store pour fr.devcoorp.thoua, en base64
#   SENTRY_DSN                     optionnel
# Codemagic → groupe basic-env :
#   GITHUB_DISPATCH_TOKEN          PAT fine-grained, Contents Read and write
# La clé API Apple doit avoir le rôle Admin ou App Manager.
# L'app fr.devcoorp.thoua (équipe 8242X8X39V) doit déjà exister dans App Store Connect.
on:
  push:
    branches:
      - master
  repository_dispatch:
    types: [android-deployed]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.8"
  TEAM_ID: 8242X8X39V

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios-build:
    name: 🍎 Build iOS + TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.commit || github.sha }}

      - name: Clé API App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::Ajoute les secrets APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID et APP_STORE_CONNECT_PRIVATE_KEY dans le dépôt."
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$PRIVATE_KEY" > "$KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            printf '%b\n' "$PRIVATE_KEY" > "$KEY_PATH"
          fi
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ISSUER_ID" >> "$GITHUB_ENV"

      - name: Xcode stable
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Tests
        run: flutter test --reporter=expanded --exclude-tags=integration

      - name: Build Flutter (sans signature)
        run: |
          set -euo pipefail
          BUILD_NO=$(date -u +%s)
          echo "BUILD_NO=$BUILD_NO" >> "$GITHUB_ENV"
          flutter build ios --release --no-codesign \
            --dart-define=ENV=production \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --build-number="$BUILD_NO"

      - name: Certificat et profil de distribution
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "${P12_BASE64:-}" ] || [ -z "${P12_PASSWORD:-}" ] || [ -z "${PROFILE_BASE64:-}" ]; then
            echo "::error::Apple Cloud n'a pas de certificat iOS Distribution ni de profil pour fr.devcoorp.thoua, et la clé API ne peut pas les créer. Ajoute IOS_DISTRIBUTION_CERT_P12 (base64), IOS_DISTRIBUTION_CERT_PASSWORD et IOS_PROVISIONING_PROFILE (profil App Store, base64)."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/thoua.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$RUNNER_TEMP/thoua.mobileprovision" > "$PROFILE_PLIST"
          PROFILE_UUID=$(plutil -extract UUID raw "$PROFILE_PLIST")
          PROFILE_NAME=$(plutil -extract Name raw "$PROFILE_PLIST")
          cp "$RUNNER_TEMP/thoua.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive (signature manuelle)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export + upload TestFlight
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>fr.devcoorp.thoua</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "## 🍎 Build iOS $BUILD_NO envoyé sur App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "Il apparaîtra dans TestFlight après le traitement Apple." >> "$GITHUB_STEP_SUMMARY"

      - name: Nettoyage clé
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
