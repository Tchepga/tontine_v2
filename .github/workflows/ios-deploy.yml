name: 🍎 iOS → TestFlight

# Démarre uniquement après une publication Play réussie
# (codemagic.yaml → android-deploy → « Lancer TestFlight sur GitHub »).
# Relance manuelle : Actions → ce workflow → Run workflow.
#
# Secrets à créer sur l'autre ordinateur.
# GitHub → Settings → Secrets and variables → Actions :
#   APP_STORE_CONNECT_KEY_ID       ID de la clé API App Store Connect
#   APP_STORE_CONNECT_ISSUER_ID    Issuer ID
#   APP_STORE_CONNECT_PRIVATE_KEY  contenu du fichier AuthKey_XXXX.p8
#   SENTRY_DSN                     optionnel
# Codemagic → groupe basic-env :
#   GITHUB_DISPATCH_TOKEN          PAT fine-grained, Contents Read and write
# La clé API Apple doit avoir le rôle Admin ou App Manager.
# L'app fr.devcoorp.thoua (équipe 8242X8X39V) doit déjà exister dans App Store Connect.
on:
  repository_dispatch:
    types: [android-deployed]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.8"
  TEAM_ID: 8242X8X39V

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios-build:
    name: 🍎 Build iOS + TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.commit || github.sha }}

      - name: Clé API App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::Ajoute les secrets APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID et APP_STORE_CONNECT_PRIVATE_KEY dans le dépôt."
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$PRIVATE_KEY" > "$KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            printf '%b\n' "$PRIVATE_KEY" > "$KEY_PATH"
          fi
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ISSUER_ID" >> "$GITHUB_ENV"

      - name: Xcode stable
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Build Flutter (sans signature)
        run: |
          set -euo pipefail
          BUILD_NO=$(date -u +%s)
          echo "BUILD_NO=$BUILD_NO" >> "$GITHUB_ENV"
          flutter build ios --release --no-codesign \
            --dart-define=ENV=production \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --build-number="$BUILD_NO"

      - name: Archive (signature automatique)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Export + upload TestFlight
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "## 🍎 Build iOS $BUILD_NO envoyé sur App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "Il apparaîtra dans TestFlight après le traitement Apple." >> "$GITHUB_STEP_SUMMARY"

      - name: Nettoyage clé
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
