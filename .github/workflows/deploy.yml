name: CI/CD — Tests & Déploiement Stores

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# ─── Variables globales ────────────────────────────────────────────────────────
env:
  FLUTTER_VERSION: '3.44.8'
  JAVA_VERSION: '17'

# ══════════════════════════════════════════════════════════════════════════════
# JOB 1 — TESTS (bloque le déploiement si échec)
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  test:
    name: 🧪 Tests Flutter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos

      - name: Tests unitaires & widgets
        run: flutter test --coverage --reporter=expanded

      # Même formule que l’ancien python (Σ compteurs DA / nb entrées DA). Ne bloque jamais le job.
      - name: Rapport couverture (lcov)
        shell: bash
        run: |
          set -euo pipefail
          LCOV="coverage/lcov.info"
          GOAL="${COVERAGE_GOAL_PERCENT:-70}"
          if [[ ! -f "$LCOV" ]]; then
            echo "::warning::Fichier $LCOV absent — la step « Tests » doit réussir avec --coverage"
            exit 0
          fi
          read -r pct hits total <<< "$(awk -F',' '
            /^DA:/ { t++; h += ($2 == "" ? 0 : $2 + 0) }
            END {
              if (t > 0) printf "%.1f %d %d\n", 100 * h / t, h, t
              else print "0.0 0 0"
            }
          ' "$LCOV")"
          echo "Couverture (lcov, métrique historique): ${pct}% (Σ hits=${hits} / ${total} entrées DA)"
          echo "Objectif référence: ${GOAL}%"
          if awk -v p="$pct" -v g="$GOAL" 'BEGIN { exit !(p + 0 < g + 0) }'; then
            echo "::warning::Couverture ${pct}% sous l'objectif ${GOAL}%"
          fi
          exit 0
        env:
          COVERAGE_GOAL_PERCENT: "70"

# ══════════════════════════════════════════════════════════════════════════════
# JOB 2 — Android (Codemagic, pas GitHub Actions)
# Le keystore « tontine_keystore » est stocké sur Codemagic (non téléchargeable).
# Publication Play Store = codemagic.yaml → android-deploy.
# ══════════════════════════════════════════════════════════════════════════════
  android-status:
    name: 🤖 Android → Codemagic (Play Store)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Rappel déploiement Android
        run: |
          echo "::notice::Android / Play Store est géré par Codemagic (codemagic.yaml → android-deploy), pas par GitHub Actions."
          echo "## Android" >> "$GITHUB_STEP_SUMMARY"
          echo "Déploiement Play Store (internal) via **Codemagic** (\`android-deploy\` + keystore \`tontine_keystore\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Actions ne build / ne publie **pas** Android." >> "$GITHUB_STEP_SUMMARY"

# ══════════════════════════════════════════════════════════════════════════════
# JOB 3 — iOS (Codemagic, pas GitHub Actions)
# TestFlight est publié via codemagic.yaml (workflow ios-deploy).
# ══════════════════════════════════════════════════════════════════════════════
  ios-status:
    name: 🍎 iOS → Codemagic (TestFlight)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Rappel déploiement iOS
        run: |
          echo "::notice::iOS / TestFlight est géré par Codemagic (codemagic.yaml → ios-deploy), pas par GitHub Actions."
          echo "## iOS" >> "$GITHUB_STEP_SUMMARY"
          echo "Déploiement TestFlight via **Codemagic** (\`ios-deploy\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Actions ne build / ne publie **pas** iOS." >> "$GITHUB_STEP_SUMMARY"

# ══════════════════════════════════════════════════════════════════════════════
# JOB 4 — RAPPORT FINAL
# ══════════════════════════════════════════════════════════════════════════════
  notify:
    name: 📊 Rapport déploiement
    runs-on: ubuntu-latest
    needs: [android-status, ios-status]
    if: always() && github.ref == 'refs/heads/master'
    steps:
      - name: Résumé
        run: |
          echo "## Résultat du déploiement" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Tests** → GitHub Actions" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.android-status.result }}" = "success" ]; then
            echo "ℹ️ **Android** → Via Codemagic (\`android-deploy\` + \`tontine_keystore\`)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Android** → Job statut: ${{ needs.android-status.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.ios-status.result }}" = "success" ]; then
            echo "ℹ️ **iOS** → Via Codemagic (\`ios-deploy\`)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **iOS** → Job statut: ${{ needs.ios-status.result }}" >> $GITHUB_STEP_SUMMARY
          fi
