workflows:

  # ══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 1 — Tests uniquement (Pull Requests)
  # ══════════════════════════════════════════════════════════════════════════
  tests-only:
    name: 🧪 Tests Flutter
    max_build_duration: 30
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    environment:
      flutter: 3.44.8
      xcode: latest
      java: 17
    scripts:
      - name: Récupération des dépendances
        script: flutter pub get

      - name: Analyse statique
        script: flutter analyze --no-fatal-infos

      - name: Tests unitaires & widgets
        script: flutter test --coverage --reporter=expanded

    artifacts:
      - coverage/**

  # ══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 2 — Android → Play Store internal track
  # Keystore Codemagic : référence « tontine »
  #
  # OBLIGATOIRE dans Codemagic UI (sinon « No user-defined environment variables ») :
  #   Environment variables → créer le groupe exactement nommé : google_play
  #   Variable : GCLOUD_SERVICE_ACCOUNT_CREDENTIALS = JSON brut du service account
  #   Cocher « Secure »
  # ══════════════════════════════════════════════════════════════════════════
  android-deploy:
    name: 🤖 Android → Play Store
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    environment:
      groups:
        - google_play
      flutter: 3.44.8
      java: 17
      android_signing:
        - tontine

    scripts:
      - name: Vérifier credentials Google Play
        script: |
          set -euo pipefail
          if [ -z "${GCLOUD_SERVICE_ACCOUNT_CREDENTIALS:-}" ]; then
            echo "::error::GCLOUD_SERVICE_ACCOUNT_CREDENTIALS est vide."
            echo "Le groupe d'environnement « google_play » n'est pas importé ou n'existe pas."
            echo ""
            echo "À faire dans Codemagic → tontine_v2 → Environment variables :"
            echo "  1. Créer un groupe nommé exactement : google_play"
            echo "  2. Ajouter la variable GCLOUD_SERVICE_ACCOUNT_CREDENTIALS"
            echo "  3. Coller le JSON complet du compte de service (commence par { )"
            echo "  4. Cocher Secure"
            echo "  5. Relancer le build"
            exit 1
          fi
          FIRST="$(printf '%s' "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" | head -c 1)"
          if [ "$FIRST" != "{" ]; then
            echo "::error::GCLOUD_SERVICE_ACCOUNT_CREDENTIALS ne commence pas par '{'."
            echo "Collez le JSON brut (pas de base64, pas de chemin de fichier)."
            exit 1
          fi
          echo "Credentials Google Play détectés (JSON OK)."

      - name: Set up local.properties
        script: echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Récupération des dépendances
        script: flutter pub get

      - name: Analyse statique
        script: flutter analyze --no-fatal-infos

      - name: Tests — arrêt si échec
        script: flutter test --reporter=expanded

      - name: Build AAB release (signé via CM_KEYSTORE_*)
        script: |
          set -euo pipefail
          test -n "${CM_KEYSTORE_PATH:-}" || {
            echo "CM_KEYSTORE_PATH manquant — vérifiez android_signing: tontine"
            exit 1
          }
          BUILD_NO="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-1}}"
          flutter build appbundle --release \
            --dart-define=ENV=production \
            --build-number="$BUILD_NO"
          test -f build/app/outputs/bundle/release/app-release.aab
          rm -f build/app/outputs/bundle/debug/*.aab || true

    artifacts:
      - build/app/outputs/bundle/release/*.aab

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
      email:
        recipients:
          - tchepgapatrick@yahoo.fr
        notify:
          success: true
          failure: true

  # ══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 3 — iOS → TestFlight
  # ios_signing génère les profils ; « xcode-project use-profiles » crée
  # /Users/builder/export_options.plist (NE PAS pointer vers un chemin inventé).
  # Groupe env requis : app_store_connect →
  #   APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER,
  #   APP_STORE_CONNECT_ISSUER_ID
  # ══════════════════════════════════════════════════════════════════════════
  ios-deploy:
    name: 🍎 iOS → TestFlight
    max_build_duration: 90
    # Pas de triggering auto : un push master ne lance que Android.
    # Lancer iOS manuellement dans Codemagic quand les certificats sont prêts.
    environment:
      groups:
        - app_store_connect
      flutter: 3.44.8
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fr.devcoorp.thoua

    scripts:
      - name: Récupération des dépendances
        script: flutter pub get

      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Set up code signing (génère export_options.plist)
        script: xcode-project use-profiles

      - name: Analyse statique
        script: flutter analyze --no-fatal-infos

      - name: Tests — arrêt si échec
        script: flutter test --reporter=expanded

      - name: Build IPA release
        script: |
          set -euo pipefail
          EXPORT_PLIST="/Users/builder/export_options.plist"
          test -f "$EXPORT_PLIST" || {
            echo "export_options.plist introuvable — « xcode-project use-profiles » a échoué"
            echo "Vérifiez ios_signing (distribution_type: app_store, bundle_identifier: fr.devcoorp.thoua)"
            echo "et que certificats + profils App Store sont uploadés dans Codemagic."
            exit 1
          }
          BUILD_NO="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-1}}"
          flutter build ipa --release \
            --dart-define=ENV=production \
            --build-number="$BUILD_NO" \
            --export-options-plist="$EXPORT_PLIST"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Testeurs internes
      email:
        recipients:
          - tchepgapatrick@yahoo.fr
        notify:
          success: true
          failure: true

  # ══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 4 — Distribution testeurs via lien direct (sans stores)
  # ══════════════════════════════════════════════════════════════════════════
  testers-distribution:
    name: 📲 Distribution testeurs
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
    environment:
      flutter: 3.44.8
      java: 17
      xcode: latest
      cocoapods: default
      android_signing:
        - tontine
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: fr.devcoorp.thoua

    scripts:
      - name: Set up local.properties
        script: echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Récupération des dépendances
        script: flutter pub get

      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Set up code signing iOS (ad hoc)
        script: xcode-project use-profiles

      - name: Tests
        script: flutter test --reporter=expanded

      - name: Build Android APK (pour testeurs)
        script: |
          set -euo pipefail
          BUILD_NO="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-1}}"
          flutter build apk --release \
            --dart-define=ENV=staging \
            --build-number="$BUILD_NO"

      - name: Build iOS IPA (ad hoc pour testeurs)
        script: |
          set -euo pipefail
          EXPORT_PLIST="/Users/builder/export_options.plist"
          test -f "$EXPORT_PLIST" || {
            echo "export_options.plist introuvable — vérifiez ios_signing ad_hoc + profils"
            exit 1
          }
          BUILD_NO="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-1}}"
          flutter build ipa --release \
            --dart-define=ENV=staging \
            --build-number="$BUILD_NO" \
            --export-options-plist="$EXPORT_PLIST"

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - tchepgapatrick@yahoo.fr
        notify:
          success: true
          failure: true
