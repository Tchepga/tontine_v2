workflows:

  # ══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 1 — Tests uniquement (Pull Requests)
  # ══════════════════════════════════════════════════════════════════════════
  tests-only:
    name: 🧪 Tests Flutter
    max_build_duration: 30
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    environment:
      flutter: 3.44.8
      xcode: latest
      java: 17
    scripts:
      - name: Récupération des dépendances
        script: flutter pub get

      - name: Analyse statique
        script: flutter analyze --no-fatal-infos

      - name: Tests unitaires & widgets
        script: flutter test --coverage --reporter=expanded

    artifacts:
      - coverage/**

  # ══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 2 — Android → Play Store internal track
  # Keystore Codemagic : référence « tontine »
  #
  # Credentials Play (OBLIGATOIRE) — sans ça le publish échoue :
  #   Groupe UI actuel : basic-env
  #   Variable Secure : GCLOUD_SERVICE_ACCOUNT_CREDENTIALS = JSON brut (commence par { )
  #
  # Note : la publication est faite en script (pas dans publishing.google_play)
  # pour éviter l’échec immédiat « Preparing build machine » si la var est vide.
  # ══════════════════════════════════════════════════════════════════════════
  android-deploy:
    name: 🤖 Android → Play Store
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
        - pattern: main
          include: true
      cancel_previous_builds: true
    environment:
      groups:
        - basic-env
      flutter: 3.44.8
      java: 17
      android_signing:
        - tontine

    scripts:
      - name: Set up local.properties
        script: echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Récupération des dépendances
        script: flutter pub get

      - name: Analyse statique
        script: flutter analyze --no-fatal-infos

      - name: Tests — arrêt si échec
        script: flutter test --reporter=expanded

      - name: Build AAB release (signé via CM_KEYSTORE_*)
        script: |
          set -euo pipefail
          test -n "${CM_KEYSTORE_PATH:-}" || {
            echo "CM_KEYSTORE_PATH manquant — vérifiez android_signing: tontine"
            exit 1
          }
          BUILD_NO="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-1}}"
          flutter build appbundle --release \
            --dart-define=ENV=production \
            --build-number="$BUILD_NO"
          test -f build/app/outputs/bundle/release/app-release.aab
          rm -f build/app/outputs/bundle/debug/*.aab || true

      - name: Publish to Google Play (internal)
        script: |
          set -euo pipefail
          CREDS="${GCLOUD_SERVICE_ACCOUNT_CREDENTIALS:-${GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS:-}}"
          if [ -z "$CREDS" ]; then
            echo "============================================================"
            echo "ERREUR : aucun credential Google Play dans l'environnement."
            echo "Log Codemagic : « No user-defined environment variables were set »"
            echo ""
            echo "À configurer MAINTENANT dans Codemagic UI :"
            echo "  App tontine_v2 → Environment variables"
            echo "  Groupe          : basic-env (déjà utilisé)"
            echo "  Variable name   : GCLOUD_SERVICE_ACCOUNT_CREDENTIALS"
            echo "  Value           : coller tout le fichier .json (commence par {)"
            echo "  Puis relancer ce workflow"
            echo "============================================================"
            exit 1
          fi
          case "$CREDS" in
            \{*) ;;
            *)
              echo "ERREUR : le credential ne commence pas par '{'. Collez le JSON brut."
              exit 1
              ;;
          esac
          export GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS="$CREDS"
          google-play bundles publish \
            --bundle "$CM_BUILD_DIR/build/app/outputs/bundle/release/app-release.aab" \
            --track internal

    artifacts:
      - build/app/outputs/bundle/release/*.aab

    publishing:
      # Pas de publishing.google_play ici : sinon Codemagic échoue dès
      # « Preparing build machine » si $GCLOUD_… est vide.
      email:
        recipients:
          - tchepgapatrick@yahoo.fr
        notify:
          success: true
          failure: true

  # ══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 3 — iOS → TestFlight
  # ios_signing génère les profils ; « xcode-project use-profiles » crée
  # /Users/builder/export_options.plist (NE PAS pointer vers un chemin inventé).
  # Groupe env requis : app_store_connect →
  #   APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER,
  #   APP_STORE_CONNECT_ISSUER_ID
  # ══════════════════════════════════════════════════════════════════════════
  ios-deploy:
    name: 🍎 iOS → TestFlight
    max_build_duration: 90
    # Pas de triggering auto : un push master ne lance que Android.
    # Lancer iOS manuellement dans Codemagic quand les certificats sont prêts.
    environment:
      groups:
        - app_store_connect
      flutter: 3.44.8
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fr.devcoorp.thoua

    scripts:
      - name: Récupération des dépendances
        script: flutter pub get

      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Set up code signing (génère export_options.plist)
        script: xcode-project use-profiles

      - name: Analyse statique
        script: flutter analyze --no-fatal-infos

      - name: Tests — arrêt si échec
        script: flutter test --reporter=expanded

      - name: Build IPA release
        script: |
          set -euo pipefail
          EXPORT_PLIST="/Users/builder/export_options.plist"
          test -f "$EXPORT_PLIST" || {
            echo "export_options.plist introuvable — « xcode-project use-profiles » a échoué"
            echo "Vérifiez ios_signing (distribution_type: app_store, bundle_identifier: fr.devcoorp.thoua)"
            echo "et que certificats + profils App Store sont uploadés dans Codemagic."
            exit 1
          }
          BUILD_NO="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-1}}"
          flutter build ipa --release \
            --dart-define=ENV=production \
            --build-number="$BUILD_NO" \
            --export-options-plist="$EXPORT_PLIST"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Testeurs internes
      email:
        recipients:
          - tchepgapatrick@yahoo.fr
        notify:
          success: true
          failure: true

  # ══════════════════════════════════════════════════════════════════════════
  # WORKFLOW 4 — Distribution testeurs via lien direct (sans stores)
  # ══════════════════════════════════════════════════════════════════════════
  testers-distribution:
    name: 📲 Distribution testeurs
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
    environment:
      flutter: 3.44.8
      java: 17
      xcode: latest
      cocoapods: default
      android_signing:
        - tontine
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: fr.devcoorp.thoua

    scripts:
      - name: Set up local.properties
        script: echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Récupération des dépendances
        script: flutter pub get

      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Set up code signing iOS (ad hoc)
        script: xcode-project use-profiles

      - name: Tests
        script: flutter test --reporter=expanded

      - name: Build Android APK (pour testeurs)
        script: |
          set -euo pipefail
          BUILD_NO="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-1}}"
          flutter build apk --release \
            --dart-define=ENV=staging \
            --build-number="$BUILD_NO"

      - name: Build iOS IPA (ad hoc pour testeurs)
        script: |
          set -euo pipefail
          EXPORT_PLIST="/Users/builder/export_options.plist"
          test -f "$EXPORT_PLIST" || {
            echo "export_options.plist introuvable — vérifiez ios_signing ad_hoc + profils"
            exit 1
          }
          BUILD_NO="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-1}}"
          flutter build ipa --release \
            --dart-define=ENV=staging \
            --build-number="$BUILD_NO" \
            --export-options-plist="$EXPORT_PLIST"

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - tchepgapatrick@yahoo.fr
        notify:
          success: true
          failure: true
